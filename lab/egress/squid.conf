# Strix lab の egress プロキシ（ARTEX-safe lab/egress/squid.conf を流用）。
# 許可するのは「strix-cli コンテナからの、allowlist.txt に載ったドメインへの CONNECT(443)」だけ。
# 平文 HTTP の中継、IP 直指定、他ポートはすべて拒否し、拒否も含めて stdout に記録する。

http_port 3128

# 利用元は strix-cli（lab/compose.yml で pentest-ctl 上の IP を 10.188.2.5 に固定）だけ。
acl cli_src src 10.188.2.5
acl SSL_ports port 443
acl CONNECT method CONNECT
# -n: 宛先が IP リテラルのとき逆引き(PTR)で照合しない（PTR を許可ドメインに向けたサーバで迂回されるのを防ぐ）
acl allowed_dst dstdomain -n "/etc/squid/allowlist.txt"
# IP リテラル宛（IPv4 / [IPv6]）の CONNECT は、許可リストと無関係に拒否する
acl ip_literal_dst dstdom_regex -n ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
acl ip_literal_dst dstdom_regex -n ^\[?[0-9a-fA-F:]*:[0-9a-fA-F:.]*\]?$

http_access deny !cli_src
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access deny ip_literal_dst
http_access allow CONNECT allowed_dst
http_access deny all

# キャッシュしない・ディスクを使わない
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 0 KB
pid_filename none
coredump_dir /tmp

# ログは stdout / stderr へ（docker compose logs egress-proxy で見る）
logformat lab %ts.%03tu %>a %Ss/%03>Hs %rm %ru %<a
access_log stdio:/dev/stdout lab
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0

# 送信元の情報を外へ出さない
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

pinger_enable off
visible_hostname egress-proxy
shutdown_lifetime 1 seconds
